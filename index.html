<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <p class="label" id="label">Reaction timer</p>
    <h1 id="message">Click to start</h1>
    <p class="hint" id="hint">Wait for green, then click as fast as you can.</p>
    <p class="stats">
      Last: <span id="last">—</span>
      · Best: <span id="best">—</span>
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
